<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8b3a1f">
  <meta name="description" content="Recetario personal: crea y guarda tus recetas de cocina">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recetario">
  <title>Recetario · Cuaderno de cocina</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- FontAwesome -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i class="fa-solid fa-utensils"></i>
        </span>
        <div class="brand-text">
          <h1 class="brand-title">Recetario</h1>
          <p class="brand-sub" id="brandSub">Cuaderno de cocina</p>
        </div>
      </div>
    </header>

    <main class="views" id="views">

      <!-- ============ VISTA: CREAR / EDITAR ============ -->
      <section class="view active" id="view-create">
        <form id="recipeForm" class="form" autocomplete="off" novalidate>

          <div class="edit-banner" id="editBanner" hidden>
            <div class="edit-banner-content">
              <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
              <span>Editando: <strong id="editName"></strong></span>
            </div>
            <button type="button" id="cancelEdit" class="edit-banner-cancel">
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
              <span>Cancelar</span>
            </button>
          </div>

          <fieldset class="form-section">
            <legend class="form-legend">La receta</legend>

            <div class="field">
              <label for="name">Nombre</label>
              <input id="name" type="text" placeholder="Ej: Cóctel de atún" required>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="category">Categoría</label>
                <select id="category"></select>
              </div>
              <div class="field">
                <label for="portions">Porciones</label>
                <input id="portions" type="text" placeholder="Ej: 4 personas">
              </div>
            </div>

            <div class="field">
              <label>Puntuación</label>
              <div class="stars" id="stars" role="radiogroup" aria-label="Puntuación"></div>
            </div>

            <div class="field">
              <label for="desc">Descripción breve</label>
              <input id="desc" type="text" maxlength="120"
                     placeholder="Ej: Cóctel de atún con piña y cebolla" required>
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend class="form-legend">Ingredientes</legend>
            <div id="ingredients" class="ingredients"></div>
            <button type="button" id="addIngredient" class="btn-add">
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
              <span>Añadir ingrediente</span>
            </button>
          </fieldset>

          <fieldset class="form-section">
            <legend class="form-legend">Preparación</legend>
            <div class="field">
              <label for="steps" class="sr-only">Pasos</label>
              <textarea id="steps" rows="7"
                        placeholder="Describe los pasos, uno por línea..."></textarea>
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend class="form-legend">Notas y apuntes</legend>
            <div class="field">
              <label for="notes" class="sr-only">Notas</label>
              <textarea id="notes" rows="4"
                        placeholder="Recomendaciones, mejoras, trucos, sustituciones..."></textarea>
            </div>
          </fieldset>

          <button type="submit" class="btn primary" id="submitBtn">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
            <span>Guardar receta</span>
          </button>
        </form>
      </section>

      <!-- ============ VISTA: LIBRO DE RECETAS ============ -->
      <section class="view" id="view-book">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
          <input id="search" type="search"
                 placeholder="Buscar receta, ingrediente o categoría…">
        </div>
        <div id="bookContent" class="book"></div>
      </section>

    </main>

    <nav class="nav" id="nav" aria-label="Navegación principal">
      <span class="nav-indicator" id="navIndicator"></span>
      <button class="navbtn active" data-view="create" aria-label="Crear receta">
        <span class="navbtn-icon" aria-hidden="true"><i class="fa-solid fa-pen-to-square"></i></span>
        <span class="navbtn-label">Crear</span>
      </button>
      <button class="navbtn" data-view="book" aria-label="Abrir recetario">
        <span class="navbtn-icon" aria-hidden="true"><i class="fa-solid fa-book-open"></i></span>
        <span class="navbtn-label">Recetario</span>
      </button>
    </nav>

  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="recipes-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
